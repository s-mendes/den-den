name: den-den

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: den-den-app
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
    networks:
      - apps-network

networks:
  apps-network:
    external: true
