name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || 'den-den' }}

jobs:
  image:
    name: Build e publicar imagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      sha: ${{ steps.ref.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Definir commit
        id: ref
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir imagem
        id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY}"
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.ref.outputs.sha }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: image
    permissions:
      contents: read
      packages: read
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$VPS_SSH_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Enviar arquivos de deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          test -n "$VPS_USER"
          target="$VPS_USER@$VPS_HOST"
          ssh -i ~/.ssh/vps_key -p "$VPS_SSH_PORT" "$target" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/vps_key -P "$VPS_SSH_PORT" infra/production.compose.yaml "$target:$DEPLOY_PATH/compose.yaml"
          scp -i ~/.ssh/vps_key -P "$VPS_SSH_PORT" infra/scripts/deploy-vps.sh "$target:$DEPLOY_PATH/deploy-vps.sh"

      - name: Login no GHCR pela VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target="$VPS_USER@$VPS_HOST"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/vps_key -p "$VPS_SSH_PORT" "$target" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Atualizar containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          APP_IMAGE: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.sha }}
        run: |
          target="$VPS_USER@$VPS_HOST"
          ssh -i ~/.ssh/vps_key -p "$VPS_SSH_PORT" "$target" "cd '$DEPLOY_PATH' && chmod +x deploy-vps.sh && DEPLOY_DIR='$DEPLOY_PATH' ./deploy-vps.sh '$APP_IMAGE'"
